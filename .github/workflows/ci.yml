name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.96.1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build daemon
        run: cargo build --locked
      - name: Multi-node smoke test
        run: python3 scripts/smoke-network.py --binary target/debug/tomei-chain
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build container
        run: docker build --tag tomei-chain:ci .
